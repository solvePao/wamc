name: Build
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble Android APK
        working-directory: android
        run: ./gradlew --console=plain :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          include-hidden-files: true
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Apple silicon runner
        run: test "$(uname -m)" = arm64
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - uses: actions/cache@v4
        with:
          path: |
            macos/.build/artifacts
            macos/.build/checkouts
            macos/.build/repositories
          key: swift-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/Package.resolved', 'macos/Package.swift') }}
          restore-keys: swift-dependencies-${{ runner.os }}-${{ runner.arch }}-
      - name: Build release executable
        working-directory: macos
        run: xcrun swift build -c release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build
          include-hidden-files: true
          retention-days: 14
          path: macos/.build/**/WAMC
